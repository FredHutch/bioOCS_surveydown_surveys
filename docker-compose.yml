version: '3.3'
services:
  bioocs-data-science-reviewer:
    image: sc-registry.fredhutch.org/bioocs-data-science-reviewer:latest
    networks:
      - sc-swarm-net
    deploy:
      restart_policy:
        condition: on-failure
      labels:
        - "org.fredhutch.first_deployed_date=2026-09-09T17:53:28Z"
        - "org.fredhutch.app.owner=cwright2@fredhutch.org"
        - "org.fredhutch.github.repo=bioOCS_surveydown_surveys"
        - "traefik.enable=true"
        - "traefik.http.routers.bioocs-data-science-reviewer.rule=Host(`bioocs.fredhutch.org`)"
        - "traefik.http.routers.bioocs-data-science-reviewer-secured.rule=Host(`bioocs.fredhutch.org`)"
        - "traefik.http.routers.bioocs-data-science-reviewer.entrypoints=web,web-secured"
        - "traefik.http.services.bioocs-data-science-reviewer.loadbalancer.server.port=80" # it seems you always need to give traefik a port so it 'notices' the service
        - "traefik.http.routers.bioocs-data-science-reviewer.tls=true"

networks:
  sc-swarm-net:
    external: true
